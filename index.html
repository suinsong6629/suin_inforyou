<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미래전략 사업단 V17.9_Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400;700&display=swap');
        :root { --bg-gradient: linear-gradient(135deg, #dce4ff 0%, #f1f5f9 50%, #ffe4e6 100%); --glass: rgba(255, 255, 255, 0.75); --glass-border: rgba(255, 255, 255, 0.4); --primary: #3182f6; --red: #fb7185; --text-main: #191f28; --text-sub: #4e5968; --shadow: 0 8px 32px rgba(0, 0, 0, 0.05); }
        body.is-locked #main-wrapper { filter: blur(25px); pointer-events: none; }
        #lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20000; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        body.is-locked #lock-screen { display: flex; }
        * { font-family: 'Gowun Dodum', sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg-gradient); background-attachment: fixed; min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; color: var(--text-main); }
        #main-wrapper { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }
        #gatekeeper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .lock-card { background: var(--glass); padding: 50px; border-radius: 30px; box-shadow: var(--shadow); text-align: center; width: 100%; max-width: 420px; border: 1px solid var(--glass-border); backdrop-filter: blur(15px); }
        #main-app { display: none; flex-direction: column; gap: 20px; width: 100%; }
        .glass-card { background: var(--glass); border-radius: 24px; padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .qa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
        .qa-grid-2x2 { grid-template-columns: repeat(2, 1fr); }
        .qa-tile-logo { padding: 18px 14px; background: #ffffff; }
        .qa-tile-logo img { width: 82%; height: auto; max-height: 60px; object-fit: contain; display: block; margin: 0 auto; }
        .qa-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px 8px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; box-shadow: 0 2px 10px rgba(15,23,42,0.05); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; min-height: 106px; box-sizing: border-box; }
        .qa-tile:hover { transform: translateY(-4px); box-shadow: 0 14px 28px -8px var(--tile-a); border-color: var(--tile-a); }
        .qa-tile-text { font-size: 30px; font-weight: 800; color: var(--text-sub); text-align: center; transition: color .18s ease; }
        .qa-tile:hover .qa-tile-text { color: var(--tile-a); }
        @media (max-width: 520px) { .qa-two-cols { grid-template-columns: 1fr; } }
        .calendar-table { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
        .calendar-td { height: 90px; vertical-align: top; padding: 8px; border: 1px solid rgba(125,125,125,0.1); border-radius: 10px; background: rgba(255,255,255,0.2); }
        .day-num { font-weight: 700; font-size: 12px; }
        .event-bar { height: 20px; background: rgba(251, 113, 133, 0.2); border-bottom: 2.5px solid var(--red); font-size: 10px; font-weight: 700; color: #b91c1c; display: flex; align-items: center; justify-content: center; border-radius: 4px; margin-bottom: 2px; overflow: hidden; white-space: nowrap; }
        .today { background: rgba(49, 130, 246, 0.15) !important; outline: 2px solid var(--primary) !important; outline-offset: -2px; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(125,125,125,0.2); margin-bottom: 12px; background: rgba(255,255,255,0.5); color: inherit; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49,130,246,0.15); }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; font-weight: 700; color: var(--text-sub); padding-left: 2px; }
        .field input { margin-bottom: 0; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 16px; }
        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .two-cols { grid-template-columns: 1fr; } }
        .perf-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .perf-total-label { font-size: 12px; color: var(--text-sub); font-weight: 700; text-align: right; }
        .perf-total-value { font-size: 28px; font-weight: 800; color: var(--primary); text-align: right; }
    </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2TfR2pFEo2SdY-m_Za-ISMxF65Z_j528vc73DnWzMFMY6qYYEcuNUpxzPxnGm89mobQ/exec';
    const W_API_KEY = 'e9e4b4788a9cb01857b3d430b6551c24';
    let sessionKey = "";
    const $ = id => document.getElementById(id);

    function unlockApp() { $('gatekeeper').style.display = 'none'; $('main-app').style.display = 'flex'; updateClock(); setInterval(updateClock, 1000); fetchWeather(); drawCal(); fetchMonthlyStats(); }

    async function tryAccess() {
        const pass = $('entry-pass').value.trim(); if(!pass) return;
        $('access-btn').disabled = true; $('access-btn').innerText = "인증 중...";
        try {
            const res = await fetch(`${SCRIPT_URL}?action=auth&key=${encodeURIComponent(pass)}`);
            const data = await res.json();
            if(data[0] && data[0].error === "SITE_LOCKED") { document.body.classList.add('is-locked'); return; }
            if(data.status === "success") { sessionKey = pass; unlockApp(); }
            else { $('lock-error-area').innerHTML = `<p style="color:red; font-size:12px;">${data[0].error || "비밀번호 오류"}</p>`; $('access-btn').disabled = false; }
        } catch(e) { $('lock-error-area').innerHTML = `<p style="color:red; font-size:12px;">⚠️ 서버 연결 오류</p>`; $('access-btn').disabled = false; }
    }

    function updateClock() { const n = new Date(); const days = ["일", "월", "화", "수", "목", "금", "토"]; $('cur-date').innerText = `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${days[n.getDay()]})`; let hrs = n.getHours(); const ampm = hrs >= 12 ? 'PM' : 'AM'; hrs = hrs % 12 || 12; $('cur-time').innerText = `${ampm} ${hrs}:${String(n.getMinutes()).padStart(2, '0')}`; }
    async function fetchWeather() { try { const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Seoul&appid=${W_API_KEY}&units=metric&lang=kr`); const d = await res.json(); $('we-temp').innerText = `${Math.round(d.main.temp)}°C`; $('we-icon').innerText = d.weather[0].icon.includes('01') ? '☀️' : '☁️'; } catch (e) {} }

    function drawCal() {
        const n = new Date(); const y = n.getFullYear(); const m = n.getMonth(); 
        $('cal-title').innerText = `${y}년 ${m + 1}월`;
        const firstDay = new Date(y, m, 1).getDay(); const lastDate = new Date(y, m + 1, 0).getDate();
        let html = '<tr>';
        
        // 이벤트 데이터 정의 (원본대로 유지)
        const events = [
            { start:'2026-07-01', end:'2026-07-03', text:'워크샵' },
            { start:'2026-07-01', end:'2026-07-01', text:'윤성휴가' },
            { start:'2026-07-17', end:'2026-07-17', text:'제헌절' },
            { start:'2026-07-14', end:'2026-07-14', text:'수인반차' },
            { start:'2026-07-28', end:'2026-07-28', text:'은지반차' },
            { start:'2026-07-29', end:'2026-07-30', text:'윤성휴가' }
        ];

        for(let i=0; i<firstDay; i++) html += '<td class="calendar-td"></td>';
        for(let d=1; d<=lastDate; d++) {
            const curIdx = (firstDay + d - 1) % 7; if (d > 1 && curIdx === 0) html += '</tr><tr>';
            const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = (d === n.getDate() && m === n.getMonth() && y === n.getFullYear()) ? 'today' : '';
            const dayEvents = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end);
            const evHtml = dayEvents.map(ev => `<div class="event-bar">${ev.text}</div>`).join('');
            html += `<td class="calendar-td ${isToday}"><span class="day-num">${d}</span><div style="margin-top:2px;">${evHtml}</div></td>`;
        }
        $('cal-body-content').innerHTML = html + '</tr>';
    }

    async function findCustomer() {
        const name = $('searchName').value.trim(); if(!name) return;
        $('searchStatus').innerText = "🔎 통합 검색 중...";
        try {
            const res = await fetch(`${SCRIPT_URL}?action=search&name=${encodeURIComponent(name)}&key=${encodeURIComponent(sessionKey)}`);
            const results = await res.json();
            const list = $('resultList'); list.innerHTML = '';
            if(!results || results.length === 0) { $('searchStatus').innerText = `❌ 결과 없음`; $('searchResultArea').style.display = 'none'; return; }
            results.forEach(item => {
                const card = document.createElement('div');
                card.style.cssText = 'background:rgba(255,255,255,0.5); border-radius:12px; padding:14px; font-size:13px; line-height:1.9;';
                card.innerHTML = `<div style="font-weight:700; font-size:15px; margin-bottom:4px;">${item.name}</div><div><b>취급자:</b> ${item.handler}</div><div><b>주민번호:</b> ${item.residentId}</div><div><b>연락처:</b> ${item.phone}</div><div><b>주소:</b> ${item.address}</div><div><b>직업:</b> ${item.job}</div><div><b>계좌정보:</b> ${item.account}</div>`;
                list.appendChild(card);
            });
            $('searchResultArea').style.display = 'block'; $('searchStatus').innerText = `✅ 조회 완료 (${results.length}건)`;
        } catch(e) { $('searchStatus').innerText = "❌ 조회 오류"; }
    }

    let perfChartInstance = null;
    async function fetchMonthlyStats() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=monthlyStats&key=${encodeURIComponent(sessionKey)}`);
            const d = await res.json();
            if (d.error) { $('perf-month-label').innerText = "불러오기 실패"; console.error(d.error); return; }
            $('perf-month-label').innerText = `${d.year}년 ${d.currentMonth}월 실적`;
            $('perf-current-total').innerText = `${Math.round(d.currentTotal).toLocaleString()}원`;
            renderPerfChart(d.monthly);
        } catch (e) { $('perf-month-label').innerText = "불러오기 실패"; console.error(e); }
    }

    function renderPerfChart(monthly) {
        const ctx = document.getElementById('perfChart').getContext('2d');
        const labels = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
        if (perfChartInstance) perfChartInstance.destroy();
        perfChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '월별 실적',
                    data: monthly,
                    borderColor: '#3182f6',
                    backgroundColor: 'rgba(49,130,246,0.12)',
                    borderWidth: 3,
                    pointRadius: 4,
                    pointBackgroundColor: '#3182f6',
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (c) => `${Math.round(c.parsed.y).toLocaleString()}원` } }
                },
                scales: {
                    y: { ticks: { callback: (v) => (v/10000).toLocaleString() + '만' } }
                }
            }
        });
    }

    async function startProcess() {
        const dVal = $('cDate').value; const uN = $('uName').value.trim(); const pN = $('pName').value.trim();
        if (!dVal || !uN || !pN) return alert("필수 정보가 누락되었습니다.");
        $('process-btn').disabled = true; $('processStatus').innerText = "🚀 드라이브 파일 불러오는 중...";
        try {
            const dt = new Date(dVal);
            const dObj = { y: dt.getFullYear().toString().slice(-2), m: (dt.getMonth()+1).toString(), day: dt.getDate().toString() };

            const res = await fetch(`${SCRIPT_URL}?action=fetchFiles&key=${encodeURIComponent(sessionKey)}`);
            const rawText = await res.text();
            let filesData;
            try {
                filesData = JSON.parse(rawText);
            } catch (parseErr) {
                console.error('서버 원본 응답(JSON 아님):', rawText);
                throw new Error('서버 응답이 JSON이 아닙니다. 콘솔에 찍힌 "서버 원본 응답"을 확인하세요. (배포 미갱신 가능성)');
            }
            if (!filesData.data1 || !filesData.data2) throw new Error("드라이브 폴더에서 원본 파일을 찾지 못했습니다. 파일명을 확인해주세요.");

            $('processStatus').innerText = "🖊️ 마스킹 처리 중...";
            const i1 = await renderPdf(filesData.data1, "동", dObj, uN, pN);
            const i2 = await renderPdf(filesData.data2, "고", dObj, uN, pN);

            $('processStatus').innerText = "📤 전송 중...";
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'save', key: sessionKey, file1Data: i1, fileName1: `${uN}_고지의무.jpg`, file2Data: i2, fileName2: `${uN}_동의서.jpg` }) });
            $('processStatus').innerText = "✅ 마스킹 및 전송 완료!";
        } catch (e) { console.error(e); $('processStatus').innerText = "❌ 오류: " + e.message; } finally { $('process-btn').disabled = false; }
    }

    function dataURItoUint8Array(dataURI) {
        const base64 = dataURI.split(',')[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function renderPdf(dataUri, type, dy, n, p) {
        const canvas = document.createElement('canvas');
        const pdf = await pdfjsLib.getDocument({ data: dataURItoUint8Array(dataUri) }).promise;
        const page = await pdf.getPage(1);
        const baseViewport = page.getViewport({ scale: 1.0 });
        const scale = 2.0; 
        const viewport = page.getViewport({ scale: scale });
        canvas.width = viewport.width; canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        const ratioX = canvas.width / baseViewport.width;
        const ratioY = canvas.height / baseViewport.height;
        const drawText = (t, x, y, sz=13) => { ctx.font = `${sz * ratioY}px 'Malgun Gothic'`; ctx.fillStyle = "#000"; ctx.fillText(t, x * ratioX, canvas.height - (y * ratioY)); };
        const drawCheck = (x, y) => { ctx.font = `bold ${22 * ratioY}px Arial`; ctx.fillStyle = "red"; ctx.textAlign = "center"; ctx.fillText("v", x * ratioX, canvas.height - (y * ratioY)); ctx.textAlign = "start"; };
        if(type === "고") {
            [612, 579, 548, 504, 445, 385, 340, 310, 273].forEach(y => drawCheck(500, y));
            drawText(dy.y, 199, 209); drawText(dy.m, 230, 209); drawText(dy.day, 256, 209); drawText(n, 431, 209); drawText(n, 500, 209);
            drawText(dy.y, 200, 96); drawText(dy.m, 225, 96); drawText(dy.day, 250, 96); drawText(p, 430, 96); drawText(p, 505, 96);
        } else {
            [640, 545, 428, 310, 234].forEach(y => drawCheck(522, y));
            drawText(dy.y, 254, 138); drawText(dy.m, 300, 138); drawText(dy.day, 341, 138); drawText(n, 150, 107); drawText(n, 239, 107);
            drawText("미래전략사업단", 150, 58); drawText(p, 416, 64); drawText(p, 500, 64);
        }
        return canvas.toDataURL('image/jpeg', 0.9);
    }
</script>
